{% set name = "django-baton" %}
{% set version = "5.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/83/95/a7a4af30d39122a63d8869a1c4fc3c240a831589ca7279a77b483d0f5f85/django_baton-5.9.3.tar.gz
  sha256: b9170d6c57f4e1afc86f1155aa36c47a90cc0fd772bb99f6b76c89548213a340

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - django
    - python
    - pip
    - setuptools
  run:
    - django
    - python

about:
  home: http://github.com/otto-torino/django-baton
  summary: A cool, modern and responsive django admin application
  dev_url: http://github.com/otto-torino/django-baton
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - http://github.com/gb119

